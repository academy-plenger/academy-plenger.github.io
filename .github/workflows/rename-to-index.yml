name: Rename modern file to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename academy-plenger-modern.html to index.html
        run: |
          git config user.name "Bobonsam"
          git config user.email "Bobonsam@users.noreply.github.com"
          git mv academy-plenger-modern.html index.html
          git commit -m "Update 16 Nov 2026: revamp tampilan modern — desain baru, isi sama"
          git push
